<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>User List App</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
      }
      ul {
        padding-left: 20px;
      }
      li {
        margin-bottom: 8px;
      }
      .delete-button {
        margin-left: 8px;
        background-color: red;
        color: white;
        border: none;
      }
      .delete-button:hover {
        background-color: white;
        color: red;
        cursor: pointer;
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <h1>ユーザー一覧</h1>

    <!-- データを表示する空の容器 -->
    <ul id="user-list">
      <li>読み込み中...</li>
    </ul>

    <form id="user-form">
      <div>
        <label for="name">名前を入力: </label>
        <input type="text" name="name" id="name" required />
      </div>
      <div>
        <label for="email">メールアドレス: </label>
        <input type="email" name="email" id="email" required />
      </div>
      <div>
        <input type="submit" value="登録!" />
      </div>
    </form>

    <script>
      // 画面の読み込みが終わったら API を呼び出す
      document.addEventListener("DOMContentLoaded", () => {
        // 1. サーバーの /api/users エンドポイントへ API リクエストを送信
        fetch("/api/users")
          .then((response) => {
            if (!response.ok) {
              throw new Error("ネットワークエラーが発生しました");
            }
            // 2. レスポンス（JSON文字列）を JavaScript のオブジェクト/配列に変換
            return response.json();
          })
          .then((users) => {
            // 3. 描画先の <ul> 要素を取得
            const listElement = document.getElementById("user-list");

            // 既存の中身（読み込み中...）をクリア
            listElement.innerHTML = "";

            // 4. 配列データをループして <li> 要素を生成・挿入
            users.forEach((user) => {
              const li = document.createElement("li");
              li.textContent = `${user.name} (${user.email})`;

              // 削除ボタンを追加（クリック時の処理はまだ無い）
              const deleteButton = document.createElement("button");
              deleteButton.className = "delete-button";
              deleteButton.textContent = "削除";
              // どのユーザーを削除するのか後で取り出せるように id を持たせておく
              deleteButton.dataset.id = user.id;
              li.appendChild(deleteButton);

              listElement.appendChild(li);
            });
          })
          .catch((error) => {
            console.error("エラー:", error);
            document.getElementById("user-list").innerHTML = '<li style="color: red;">データの取得に失敗しました</li>';
          });
      });

      const form = document.getElementById("user-form");
      form.addEventListener("submit", (event) => {
        // ページリロードをキャンセル
        event.preventDefault();

        const formData = new FormData(form);

        fetch("/api/users", {
          method: "POST",
          body: new URLSearchParams(formData),
        })
          .then((response) => {
            if (response.status === 201) {
              // 特定のパスへ明示的にジャンプ
              window.location.href = "/";
            } else if (response.status === 400) {
              alert("必要な情報が入力されていません");
            } else {
              alert("登録に失敗しました");
            }
          })
          .catch((error) => {
            console.error("通信エラー:", error);
            alert("通信エラーが発生しました");
          });
      });
    </script>
  </body>
</html>
